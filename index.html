<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 Salesapp Vision</title>
    <meta name="description" content="Nahrajte fotografie regálov a umelá inteligencia identifikuje produkty a ich ceny. Aplikácia zoradí výsledky podľa ceny a miery istoty pre efektívnu cenovú analýzu." />
    <meta property="og:title" content="2026 Salesapp Vision" />
    <meta property="og:description" content="Nahrajte fotografie regálov a umelá inteligencia identifikuje produkty a ich ceny. Aplikácia zoradí výsledky podľa ceny a miery istoty pre efektívnu cenovú analýzu." />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#18181b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      @keyframes pulse {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(163, 230, 53, 0.7);
        }
        50% {
          box-shadow: 0 0 0 8px rgba(163, 230, 53, 0);
        }
      }
      .highlight-box {
        border-width: 3px !important;
        border-color: #a3e635 !important; 
        animation: pulse 2s infinite;
        z-index: 25 !important;
      }
      
      /* Global Analysis Status Styles Moved from Component to prevent Error #310 */
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .animate-shimmer {
        animation: shimmer 2s infinite linear;
      }
      @keyframes fade-in-down {
        0% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-down {
        animation: fade-in-down 0.4s ease-out forwards;
      }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d4d4d8; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </head>
  <body class="bg-zinc-50 text-zinc-800 selection:bg-zinc-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
